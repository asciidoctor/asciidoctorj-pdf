name: Build Main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    strategy:
      max-parallel: 8
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        java:
          - 11
          - 17
          - 21
        # JRuby 10.1.2.0 is not supported, see https://github.com/jruby/jruby/issues/9727 (fixed in 10.1.3.0)
        jrubyVersion:
          - 9.4.15.0
          - 10.1.1.0
        exclude:
          - java: 11
            jrubyVersion: 10.1.1.0
          - java: 17
            jrubyVersion: 10.1.1.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build & Test
        run: |
          ./gradlew -S -PjrubyVersion=${{ matrix.jrubyVersion }} -Pskip.signing assemble check
  build-windows:
    name: Build on Windows
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - windows-latest
        java:
          - 11
          - 17
          - 21
        # JRuby 10.1.2.0 is not supported, see https://github.com/jruby/jruby/issues/9727 (fixed in 10.1.3.0)
        jrubyVersion:
          - 9.4.15.0
          - 10.1.1.0
        exclude:
          - java: 11
            jrubyVersion: 10.1.1.0
          - java: 17
            jrubyVersion: 10.1.1.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build & Test
        shell: cmd
        run: |
          gradlew.bat -S -PjrubyVersion=${{ matrix.jrubyVersion }} -Pskip.signing assemble check
